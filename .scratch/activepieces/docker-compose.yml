services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DB:-activepieces}
      POSTGRES_USER: ${AP_POSTGRES_USER:-activepieces}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - activepieces-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${AP_POSTGRES_USER:-activepieces} -d $${AP_POSTGRES_DB:-activepieces}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - activepieces-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces:
    image: ghcr.io/activepieces/activepieces:latest
    restart: unless-stopped
    ports:
      - "8642:80"
    environment:
      AP_ENVIRONMENT: ${AP_ENVIRONMENT:-local}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-http://localhost:8642}
      AP_API_KEY: ${AP_API_KEY:-replace-with-a-long-random-value}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:-replace-with-32-byte-secret}
      AP_JWT_SECRET: ${AP_JWT_SECRET:-replace-with-a-long-random-value}
      AP_CONTAINER_TYPE: WORKER_AND_APP
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DB:-activepieces}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USER:-activepieces}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:-change-me-before-production}
      AP_REDIS_URL: redis://redis:6379
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-UNSANDBOXED}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - activepieces-cache:/usr/src/app/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  activepieces-postgres:
  activepieces-redis:
  activepieces-cache:
